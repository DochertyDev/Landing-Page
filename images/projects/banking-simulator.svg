<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Banking Simulator</title><desc id="desc">Concept illustration of deposits and lending cycles in fractional-reserve banking</desc><rect width="960" height="480" fill="#091d38"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50" y="65" font-size="32" fill="#d8eaff">Banking Simulator</text><text x="50" y="105" font-size="20" fill="#9cbbdc">Follow deposits and loans through each cycle</text><g transform="translate(80 285) rotate(-4)"><rect width="280" height="120" rx="10" fill="#123451" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#d8eaff">Initial deposit</text><text x="22" y="76" font-size="21" fill="#d8eaff">Set reserve ratio</text></g><g transform="translate(335 225) rotate(-4)"><rect width="280" height="130" rx="10" fill="#306ca6" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#d8eaff">Loans + deposits</text><text x="22" y="76" font-size="21" fill="#d8eaff">Cycle 1 / 2 / 3</text></g><g transform="translate(590 165) rotate(-4)"><rect width="300" height="155" rx="10" fill="#b7d9ff" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#112c4e">Explore the effect</text><text x="22" y="76" font-size="21" fill="#112c4e">Reserves / Loans</text><text x="22" y="108" font-size="21" fill="#112c4e">Money in circulation</text></g></g></svg>
