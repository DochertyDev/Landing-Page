<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">RedactFlow</title><desc id="desc">Concept illustration of local document anonymization, token mapping, and restoration</desc><rect width="960" height="480" fill="#091d38"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50" y="65" font-size="32" fill="#d8eaff">RedactFlow</text><text x="50" y="105" font-size="20" fill="#9cbbdc">Sensitive documents, private by design</text><g transform="translate(80 285) rotate(-4)"><rect width="280" height="120" rx="10" fill="#123451" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#d8eaff">Original document</text><text x="22" y="76" font-size="21" fill="#d8eaff">Name: [private]</text></g><g transform="translate(335 225) rotate(-4)"><rect width="280" height="130" rx="10" fill="#306ca6" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#d8eaff">Anonymize locally</text><text x="22" y="76" font-size="21" fill="#d8eaff">Name: &lt;PERSON_1&gt;</text></g><g transform="translate(590 165) rotate(-4)"><rect width="300" height="155" rx="10" fill="#b7d9ff" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#112c4e">Restore privately</text><text x="22" y="76" font-size="21" fill="#112c4e">Token mapping</text><text x="22" y="108" font-size="21" fill="#112c4e">Original values</text></g></g></svg>
