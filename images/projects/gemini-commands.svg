<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI Custom Commands</title><desc id="desc">Concept illustration of slash commands organized into reusable development workflows</desc><rect width="960" height="480" fill="#091d38"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50" y="65" font-size="32" fill="#d8eaff">Gemini CLI Custom Commands</text><text x="50" y="105" font-size="20" fill="#9cbbdc">Reusable commands for everyday development</text><g transform="translate(80 285) rotate(-4)"><rect width="280" height="120" rx="10" fill="#123451" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#d8eaff">Choose a command</text><text x="22" y="76" font-size="21" fill="#d8eaff">/build   /design</text></g><g transform="translate(335 225) rotate(-4)"><rect width="280" height="130" rx="10" fill="#306ca6" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#d8eaff">Shape the task</text><text x="22" y="76" font-size="21" fill="#d8eaff">/docs   /fix</text></g><g transform="translate(590 165) rotate(-4)"><rect width="300" height="155" rx="10" fill="#b7d9ff" stroke="#86b7e7"/><text x="22" y="37" font-size="25" fill="#112c4e">Run a workflow</text><text x="22" y="76" font-size="21" fill="#112c4e">/visualize</text><text x="22" y="108" font-size="21" fill="#112c4e">Idea to output</text></g></g></svg>
